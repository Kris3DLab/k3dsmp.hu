<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>K3D SMP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #1a1a2e, #0f0f1a);
            color: white;
            overflow-x: hidden;
        }

        /* Animated background */
        body::before {
            content: "";
            position: fixed;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, #00adb5, #8a2be2, #ff00cc);
            animation: moveBg 10s linear infinite;
            z-index: -1;
            opacity: 0.1;
        }

        @keyframes moveBg {
            0% { transform: translate(0,0); }
            100% { transform: translate(-50%, -50%); }
        }

        header {
            text-align: center;
            padding: 30px;
        }

        header img {
            width: 120px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px #00adb5);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        header h1 {
            margin-top: 10px;
            font-size: 40px;
            text-shadow: 0 0 20px #00adb5;
        }

        nav {
            text-align: center;
            margin-bottom: 30px;
        }

        nav a {
            margin: 0 15px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            position: relative;
        }

        nav a::after {
            content: "";
            position: absolute;
            width: 0;
            height: 2px;
            background: #00adb5;
            left: 0;
            bottom: -5px;
            transition: 0.3s;
        }

        nav a:hover::after {
            width: 100%;
        }

        .hero {
            text-align: center;
            padding: 50px 20px;
        }

        .hero h2 {
            font-size: 36px;
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #00adb5; }
            to { text-shadow: 0 0 25px #8a2be2; }
        }

        .cards {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px;
            width: 260px;
            text-align: center;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 0 25px #00adb5;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, #00adb5, #8a2be2);
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<header>
    <img src="tungi.png" alt="K3D SMP Logo">
    <h1>K3D SMP</h1>
</header>

<nav>
    <a href="#">Főoldal</a>
    <a href="#">Szerver</a>
    <a href="#">Discord</a>
</nav>

<section class="hero">
    <h2>🔥 A legjobb magyar SMP élmény 🔥</h2>
    <p>Csatlakozz most és kezdődjön a kaland!</p>
</section>

<div class="cards">
    <div class="card">
        <h3>🌍 IP</h3>
        <p>play.k3dsmp.hu</p>
        <button onclick="copyIP()">Másolás</button>
    </div>

    <div class="card">
        <h3>💬 Discord</h3>
        <p>Csatlakozz a közösséghez!</p>
        <button onclick="alert('Discord hamarosan!')">Megnyitás</button>
    </div>

    <div class="card">
        <h3>🛠️ Frissítések</h3>
        <p>Eventek, új cuccok, folyamatos fejlődés!</p>
    </div>
</div>

<footer>
    © 2026 K3D SMP
</footer>

<script>
function copyIP() {
    navigator.clipboard.writeText("play.k3dsmp.hu");
    alert("IP kimásolva!");
}
</script>

</body>
</html>
