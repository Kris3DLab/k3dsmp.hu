<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K3DSMP</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family: Arial, sans-serif;
    background:#f4f6f8;
}

/* NAVBAR */
.navbar {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 40px;
    background:white;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.logo {
    font-size:24px;
    font-weight:bold;
}
.logo span { color:orange; }

.nav a {
    margin-left:20px;
    text-decoration:none;
    color:#333;
}

/* HERO */
.hero {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:60px 40px;
    background:#e9ecef;
}

.hero h1 {
    font-size:38px;
    margin-bottom:20px;
}

.hero button {
    padding:12px 20px;
    background:#28a745;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

/* CARDS */
.cards {
    display:flex;
    gap:20px;
    padding:40px;
}

.card {
    flex:1;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    text-align:center;
}

.card h2 { margin-bottom:10px; }

.card button {
    margin-top:15px;
    padding:10px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.red { background:#dc3545; color:white; }
.blue { background:#007bff; color:white; }
.green { background:#28a745; color:white; }

/* MODAL */
.modal {
    position:fixed;
    top:0; left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    display:none;
    justify-content:center;
    align-items:center;
}

.modal-content {
    background:white;
    padding:30px;
    border-radius:10px;
    width:300px;
}

.modal input {
    width:100%;
    padding:10px;
    margin:10px 0;
}

/* FOOTER */
.footer {
    background:orange;
    color:white;
    text-align:center;
    padding:15px;
}
</style>
</head>

<body>

<div class="navbar">
    <div class="logo">K3D<span>SMP</span></div>
    <div class="nav">
        <a href="#">Kezdőlap</a>
        <a href="#" onclick="openLogin()">Login</a>
        <a href="#" onclick="openRegister()">Regisztráció</a>
    </div>
</div>

<div class="hero">
    <div>
        <h1>K3DSMP Minecraft Szerver</h1>
        <button onclick="copyIP()">IP másolása</button>
    </div>
</div>

<div class="cards">
    <div class="card">
        <h2>Regisztráció</h2>
        <p>Fiók létrehozása</p>
        <button class="red" onclick="openRegister()">Megnyitás</button>
    </div>

    <div class="card">
        <h2>Letöltés</h2>
        <p>Kliens letöltése</p>
        <button class="blue" onclick="download()">Letöltés</button>
    </div>

    <div class="card">
        <h2>Bányaközpont</h2>
        <p>Rangok és vásárlás</p>
        <button class="green" onclick="shop()">Megnyitás</button>
    </div>
</div>

<!-- LOGIN MODAL -->
<div id="loginModal" class="modal">
    <div class="modal-content">
        <h3>Bejelentkezés</h3>
        <input id="loginUser" placeholder="Felhasználónév">
        <input id="loginPass" type="password" placeholder="Jelszó">
        <button onclick="login()">Belépés</button>
    </div>
</div>

<!-- REGISTER MODAL -->
<div id="registerModal" class="modal">
    <div class="modal-content">
        <h3>Regisztráció</h3>
        <input id="regUser" placeholder="Felhasználónév">
        <input id="regPass" type="password" placeholder="Jelszó">
        <button onclick="register()">Regisztráció</button>
    </div>
</div>

<div class="footer">
    K3DSMP © 2026
</div>

<script>

// IP
function copyIP(){
    navigator.clipboard.writeText("play.k3dsmp.hu");
    alert("IP kimásolva!");
}

// MODALOK
function openLogin(){ loginModal.style.display="flex"; }
function openRegister(){ registerModal.style.display="flex"; }

window.onclick = function(e){
    if(e.target.classList.contains("modal")){
        e.target.style.display="none";
    }
}

// REGISTER
function register(){
    let u = regUser.value;
    let p = regPass.value;

    if(!u || !p) return alert("Hiányzó adat!");

    localStorage.setItem(u,p);
    alert("Regisztrálva!");
    registerModal.style.display="none";
}

// LOGIN
function login(){
    let u = loginUser.value;
    let p = loginPass.value;

    if(localStorage.getItem(u) === p){
        alert("Sikeres belépés!");
        loginModal.style.display="none";
    } else {
        alert("Hibás adatok!");
    }
}

// LETÖLTÉS
function download(){
    alert("Letöltés elindulna (itt link kell)");
}

// SHOP
function shop(){
    alert("Bolt (backend kell hozzá)");
}

</script>

</body>
</html>
