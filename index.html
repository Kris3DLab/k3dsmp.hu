<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>K3DSMP</title>

<style>
body { font-family: Arial; margin:0; background:#f5f5f5; }

.navbar {
    display:flex; justify-content:space-between;
    padding:15px; background:white;
}
.logo { font-size:22px; font-weight:bold; }
.logo span { color:orange; }

.hero {
    padding:50px;
    display:flex;
    justify-content:space-between;
}

button {
    padding:10px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.green { background:green; color:white; }
.red { background:red; color:white; }
.blue { background:#007bff; color:white; }

.box {
    background:white;
    padding:20px;
    margin:20px;
    border-radius:10px;
}

.hidden { display:none; }
</style>
</head>

<body>

<div class="navbar">
    <div class="logo">K3D<span>SMP</span></div>
    <div>
        <button onclick="showLogin()">Login</button>
        <button onclick="showRegister()">Regisztráció</button>
    </div>
</div>

<div class="hero">
    <div>
        <h1>K3DSMP Minecraft Szerver</h1>
        <p>Csatlakozz most!</p>
        <button class="green" onclick="copyIP()">IP másolása</button>
    </div>
</div>

<!-- LOGIN -->
<div id="loginBox" class="box hidden">
    <h2>Bejelentkezés</h2>
    <input id="loginUser" placeholder="Felhasználónév"><br><br>
    <input id="loginPass" type="password" placeholder="Jelszó"><br><br>
    <button class="blue" onclick="login()">Belépés</button>
</div>

<!-- REGISTER -->
<div id="registerBox" class="box hidden">
    <h2>Regisztráció</h2>
    <input id="regUser" placeholder="Felhasználónév"><br><br>
    <input id="regPass" type="password" placeholder="Jelszó"><br><br>
    <button class="red" onclick="register()">Regisztrálok</button>
</div>

<!-- USER PANEL -->
<div id="userPanel" class="box hidden">
    <h2>Üdv, <span id="userName"></span>!</h2>
    <p>Ez a Bányaközpont (demo)</p>
    <button onclick="buyRank()">VIP vásárlás (fake)</button>
    <button onclick="logout()">Kijelentkezés</button>
</div>

<script>

// IP másolás
function copyIP() {
    navigator.clipboard.writeText("play.k3dsmp.hu");
    alert("IP kimásolva!");
}

// UI
function showLogin() {
    loginBox.classList.remove("hidden");
    registerBox.classList.add("hidden");
}
function showRegister() {
    registerBox.classList.remove("hidden");
    loginBox.classList.add("hidden");
}

// REGISZTRÁCIÓ
function register() {
    let user = regUser.value;
    let pass = regPass.value;

    if(!user || !pass) {
        alert("Tölts ki mindent!");
        return;
    }

    localStorage.setItem(user, pass);
    alert("Sikeres regisztráció!");
}

// LOGIN
function login() {
    let user = loginUser.value;
    let pass = loginPass.value;

    let saved = localStorage.getItem(user);

    if(saved === pass) {
        userPanel.classList.remove("hidden");
        loginBox.classList.add("hidden");
        userName.innerText = user;
    } else {
        alert("Hibás adatok!");
    }
}

// LOGOUT
function logout() {
    userPanel.classList.add("hidden");
}

// FAKE VÁSÁRLÁS
function buyRank() {
    alert("VIP megvéve! (nem igazi 😄)");
}

</script>

</body>
</html>
