<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>K3D SMP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: #0a0a12;
    color: white;
    overflow-x: hidden;
}

/* HERO */
.hero {
    height: 100vh;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    overflow: hidden;
}

/* háttér gradient overlay */
.hero::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        to bottom,
        rgba(10,10,20,0.2) 0%,
        rgba(10,10,20,0.6) 50%,
        rgba(10,10,20,1) 100%
    );
    z-index: 1;
}

/* LOGO */
.logo {
    width: 260px;
    z-index: 2;
    animation: float 4s ease-in-out infinite;
    filter: drop-shadow(0 0 40px #8a2be2);
}

@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
}

.hero h1 {
    font-size: 60px;
    margin-top: 20px;
    z-index: 2;
    background: linear-gradient(90deg, #00adb5, #8a2be2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* BUTTONS */
.btn {
    margin-top: 20px;
    padding: 12px 25px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    background: linear-gradient(45deg, #00adb5, #8a2be2);
    color: white;
    font-size: 16px;
    transition: 0.3s;
    z-index: 2;
}

.btn:hover {
    transform: scale(1.1);
}

/* SECTION */
.section {
    padding: 60px 20px;
    text-align: center;
}

.section h2 {
    font-size: 35px;
    margin-bottom: 30px;
}

/* UPDATE CARD */
.update-box {
    max-width: 800px;
    margin: auto;
    background: rgba(255,255,255,0.05);
    padding: 30px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
}

/* GALLERY */
.gallery {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 30px;
}

.gallery img {
    width: 300px;
    border-radius: 15px;
    transition: 0.3s;
    box-shadow: 0 0 15px black;
}

.gallery img:hover {
    transform: scale(1.05);
    box-shadow: 0 0 25px #8a2be2;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 20px;
    opacity: 0.6;
}

</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
    <img src="tungi.png" class="logo">
    <h1>K3D SMP</h1>
    
    <button class="btn" onclick="copyIP()">🎮 Csatlakozás</button>
    <button class="btn" onclick="openDiscord()">💬 Discord</button>
</section>

<!-- UPDATE -->
<section class="section">
    <h2>🔥 Legújabb Update</h2>

    <div class="update-box">
        <h3># A KARBANTARTÁSNAK VÉGE VAN! 🎉</h3>
        <p>
        Újra megnyitottuk a Minecraft szervert, és egy vadonatúj Húsvéti frissítéssel készültünk nektek! 🐰🌸<br><br>
        Ez egy Economy + Húsvéti Update, amelyben bekerült az eladás rendszer és a bolt is! 💰🛒
        </p>
    </div>

    <!-- KÉPEK -->
    <div class="gallery">
        <img src="kep.png" alt="Bázis">
        <img src="kep2.png" alt="Shop">
        <img src="kep3.png" alt="Kastély">
    </div>
</section>

<footer>
© 2026 K3D SMP
</footer>

<script>
function copyIP() {
    navigator.clipboard.writeText("play.k3dsmp.hu");
    alert("IP kimásolva!");
}

function openDiscord() {
    window.open("https://discord.gg/XscqNmjEzu");
}
</script>

</body>
</html>
